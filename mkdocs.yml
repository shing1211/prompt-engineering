      - Database Design: database-design.md
      - Code Review: code-review.md
      - Testing: testing.md
      - Security: security.md
      - Performance: performance.md
      - DevOps: devops.md
      - Migration: migration.md
      - Observability and SRE: observability-sre.md
      - Incident Response: incident-response.md
  - Application Development:
      - Frontend: frontend-dev.md
      - LLM Integration: llm-integration.md
      - Event-Driven Architecture: event-driven-architecture.md
      - Data Engineering: data-engineering.md
  - Platform and Infrastructure:
      - Platform Engineering: platform-engineering.md
      - Data Platforms: data-platforms.md
      - JVM Backend: jvm-backend.md
  - API Protocols:
      - GraphQL: graphql-development.md
      - gRPC: grpc-development.md
  - SDK Development:
      - SDK Build: sdk-build.md
      - SDK Documentation: sdk-docs.md
  - Documentation:
