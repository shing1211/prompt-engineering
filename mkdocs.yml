site_name: Prompt Engineering Library
site_description: >-
  Agentic-AI prompts for software project delivery, specialising in financial
  trading systems, Go backend development, and AWS cloud infrastructure.
site_author: Terence
site_url: https://shing1211.github.io/prompt-engineering/
repo_url: https://github.com/shing1211/prompt-engineering
repo_name: shing1211/prompt-engineering
edit_uri: edit/main/prompts/
copyright: Copyright &copy; 2026 Terence

docs_dir: prompts
site_dir: site

theme:
  name: material
  language: en
  features:
    - content.action.edit
    - content.action.view
    - content.code.copy
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/shing1211/prompt-engineering
      name: Source on GitHub
    - icon: fontawesome/solid/comment
      link: https://github.com/shing1211/prompt-engineering/issues
      name: Issues and proposals

# MkDocs populates page.meta from each file's YAML frontmatter, which is how
# the tags plugin below discovers tags without a custom hook.
plugins:
  - search
  - tags

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Anchor link to this section
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
