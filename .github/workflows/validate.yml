name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "prompts/**"
      - "scripts/**"
      - "*.md"
      # The three generated trees are committed, so an edit that touches only
      # one of them is exactly the change generate_agents.py --check exists to
      # reject. Without these paths a hand-edit to a committed agent would not
      # start a run at all, and the gate would only catch it on the next
      # unrelated push.
      - ".opencode/**"
      - ".claude/**"
      - ".agents/**"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # A shallow clone leaves the generators' git diff checks unable to
          # see uncommitted drift, so the idempotency assertion would pass
          # vacuously.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Material for MkDocs
        run: pip install -r requirements-docs.txt

      - name: Build site
        # Needed so validate.sh has a site/ to check links against. --strict
        # means a broken nav reference or missing page fails here.
        run: mkdocs build --strict

      - name: Frontmatter schema, generator drift, line endings, links
        # check_no_fingerprint.py forbids the corpus project name by name,
        # so the name is configured here rather than in the repository: a
        # secret, because a repository variable is readable by anyone with
        # access to the repository. Unset is a red build, not a skip --
        # the check exits non-zero when it cannot run that rule, so a
        # missing secret cannot quietly turn a published name into a
        # green one. Fork pull requests get no secrets, so they fail this
        # step until a maintainer runs it for them.
        env:
          CORPUS_NAME: ${{ secrets.CORPUS_NAME }}
        run: scripts/validate.sh

      - name: Markdown lint
        run: npx --yes markdownlint-cli@0.45.0 --config .markdownlint.yaml "prompts/*.md" "*.md"

      - name: Secret scan
        # Prompt files carry example credentials. These patterns catch a real
        # key pasted in by mistake. The pathspecs cover the three committed
        # harness trees as well as prompts/, because they hold verbatim copies
        # of the same bodies: a scan that stopped at prompts/ would pass on a
        # key that only ever reached the copy a reader installs.
        run: |
          set -euo pipefail
          if git grep -nEI \
            '(AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|gho_[A-Za-z0-9]{36}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' \
            -- 'prompts/*.md' '*.md' \
               '.opencode/agents/*.md' '.claude/agents/*.md' \
               '.agents/skills/*/SKILL.md' \
               '.opencode/commands/*.md' '.claude/commands/opsx/*.md' \
               '.cursor/commands/*.md'; then
            echo "::error::possible credential committed"
            exit 1
          fi
          echo "no credential patterns found"
