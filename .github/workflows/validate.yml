name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "prompts/**"
      - "scripts/**"
      - "*.md"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # A shallow clone leaves the generators' git diff checks unable to
          # see uncommitted drift, so the idempotency assertion would pass
          # vacuously.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Material for MkDocs
        run: pip install -r requirements-docs.txt

      - name: Build site
        # Needed so validate.sh has a site/ to check links against. --strict
        # means a broken nav reference or missing page fails here.
        run: mkdocs build --strict

      - name: Frontmatter schema, generator drift, line endings, links
        run: scripts/validate.sh

      - name: Markdown lint
        run: npx --yes markdownlint-cli@0.45.0 --config .markdownlint.yaml "prompts/*.md" "*.md"

      - name: Secret scan
        # Prompt files carry example credentials. These patterns catch a real
        # key pasted in by mistake.
        run: |
          set -euo pipefail
          if git grep -nEI \
            '(AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|gho_[A-Za-z0-9]{36}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' \
            -- 'prompts/*.md' '*.md'; then
            echo "::error::possible credential committed"
            exit 1
          fi
          echo "no credential patterns found"
