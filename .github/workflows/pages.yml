name: Deploy site to GitHub Pages

# GitHub Pages is unavailable while this repository is private on a free
# plan, so the deploy step has nowhere to publish and fails. The already
# deployed site keeps serving the last published build, which is the
# intended behaviour: it stays up, and it stops moving.
#
# This job still runs the build and the link check, so a broken site is
# caught here rather than discovered by a reader. The deploy step is
# skipped, and the job reports success, so the push is not left red.
#
# If the repository is made public again, or moved to a plan that includes
# Pages for private repositories, remove the guard and the deploy resumes
# with no other change.
on:
  push:
    branches: [main]
    paths:
      - "prompts/**"
      - "mkdocs.yml"
      - ".markdownlint.yaml"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      # Consumed by the deploy job, which cannot read this job's step
      # outputs directly.
      pages_available: ${{ steps.pages.outputs.available }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install Material for MkDocs
        run: pip install -r requirements-docs.txt

      - name: Verify generators are current
        # A stale prompts/index.md means the published counts would not
        # match the files on disk.
        run: python3 scripts/generate_index.py --check

      - name: Build site
        # --strict turns warnings into errors, so a broken nav reference or
        # a missing page fails the deploy instead of shipping silently.
        run: mkdocs build --strict

      - name: Check internal links
        run: python3 scripts/check_links.py

      # Nothing below this line runs while Pages is unavailable. The build
      # and link check above have already done their job; there is simply
      # nowhere to publish to.
      - name: Check whether Pages is available
        id: pages
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Pages is available; deploying."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pages is not enabled for this repository."
            echo "::notice::The previously deployed site continues to serve the"
            echo "::notice::last published build. Skipping deploy."
          fi

      - name: Configure Pages
        if: steps.pages.outputs.available == 'true'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: steps.pages.outputs.available == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.pages_available == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
